# =============================================================================

name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for version calculations

    # Setup .NET
    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Run tests (if tests exist)
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      continue-on-error: true

    # Upload test results
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

    # Code analysis (optional)
    - name: Run code analysis
      run: dotnet build --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true
      continue-on-error: true

    # Create NuGet package
    - name: Create NuGet package
      run: dotnet pack --configuration Release --no-build --output ./nupkg

    # Upload NuGet package
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg

    # Publish to NuGet (only on main branch and releases)
    - name: Publish to NuGet
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false  # Set to true when credentials are available
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/sqlite-multi-tenant:latest
          ${{ secrets.DOCKER_USERNAME }}/sqlite-multi-tenant:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Dependency check (optional)
    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerabilities
      run: dotnet list package --vulnerable
      continue-on-error: true

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check documentation
      run: |
        if [ ! -f "README.md" ]; then exit 1; fi
        if [ ! -d "docs" ]; then exit 1; fi
      continue-on-error: true

    - name: Validate markdown
      run: |
        for file in README.md docs/*.md; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            # Basic markdown validation
            grep -q "^#" "$file" || echo "Warning: No headers in $file"
          fi
        done
      continue-on-error: true

  analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Analyze code
      run: dotnet build --configuration Release --no-restore
      continue-on-error: true

# Summary
# This workflow:
# 1. Builds the project on every push and PR
# 2. Runs tests if available
# 3. Creates NuGet package
# 4. Publishes to NuGet on main branch pushes
# 5. Builds Docker image (requires Docker credentials)
# 6. Scans for security vulnerabilities
# 7. Validates documentation
# 8. Analyzes code
